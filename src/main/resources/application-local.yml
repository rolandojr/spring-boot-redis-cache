app:
  redis:
    error-threshold: 5
    reset-interval: 10000
    disconnect-initial-delay: 30000
    disconnect-interval: 60000

spring:
  cloud:
    config:
      enabled: false
  redis:
    host: localhost
    port: 6379
#    password:
    ssl: false
    timeout: 10000
    connectTimeout: 10000
    clientName: rolando
  r2dbc:
    url: r2dbc:postgresql://postgres:postgres@localhost:5432/postgres
    username: postgres
    password: postgres

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState, redis_audit
  endpoints:
    web:
      exposure:
        include: health,info
